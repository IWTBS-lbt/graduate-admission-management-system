# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# DataSource - MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/admission_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# MyBatis-Plus
# ===============================
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 开发环境: 打印SQL到控制台 (生产环境请注释或改用 Slf4jImpl)
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===============================
# JWT
# ===============================
jwt.secret=admission-system-jwt-secret-key-2026
jwt.expiration=86400000
